name: Deploy to Server

on:
  # Still manual whenever you want it: Actions -> Deploy to Server -> Run workflow.
  workflow_dispatch:
  # And automatic on a push to main whose tip commit says so. Every push to main
  # starts this workflow; the `if` on the job below is what decides whether it
  # actually deploys, so a run that skips costs nothing and leaves a visible
  # "skipped" entry rather than silence.
  push:
    branches: [main]

# One deploy at a time. The job stops the running container and deletes the old
# image before loading the new one, so two overlapping runs would fight over the
# host. cancel-in-progress stays false on purpose: cancelling a deploy midway
# can leave the host with the container stopped and no image to start.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The opt-in marker. `contains` is case-insensitive, so "Deploy it" and
    # "DEPLOY IT" work too, and the phrase can sit anywhere in the message.
    #
    # head_commit is the *tip* commit of the push, not every commit in it —
    # GitHub expressions cannot substring-search a list of commit messages. So
    # the rule is: the last commit you push decides. Pushing three commits with
    # the marker on the first one deploys nothing.
    #
    # head_commit is nullable in GitHub's own push schema (a branch deletion
    # pushes no tip commit), and workflow_dispatch has no head_commit at all.
    # Both are safe: a null dereference yields null and contains(null, ...) is
    # false. That false is also why the manual path needs its own clause here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'deploy it')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image carries no secrets, so dotenv finds nothing inside the
      # container. This file is shipped to the host and handed to
      # `docker run --env-file` below — that is what configures Mailgun.
      # Note: --env-file takes values literally. Do not quote them in PROD_ENV
      # (MAIL_FROM=Ekteb <no-reply@ekteb.ai>, not MAIL_FROM="Ekteb <...>").
      - name: Create .env file
        run: |
          echo "${{ vars.PROD_ENV }}" > .env
          chmod 600 .env
          echo "keys delivered:" && sed -E 's/=.*/=<set>/' .env

      - name: Build Docker image
        run: sudo docker build -t ${{ vars.NAME }}:latest .

      - name: Save Docker image to tar
        run: |
          sudo docker save ${{ vars.NAME }}:latest -o ${{ vars.NAME }}.tar
          sudo chmod 644 ${{ vars.NAME }}.tar

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.PROD_IP }} >> ~/.ssh/known_hosts

      - name: Copy Docker image and env to server
        run: |
          scp -i ~/.ssh/id_rsa ${{ vars.NAME }}.tar ${{ vars.PROD_USER }}@${{ vars.PROD_IP }}:/home/${{ vars.PROD_USER }}/${{ vars.NAME }}.tar
          scp -i ~/.ssh/id_rsa .env ${{ vars.PROD_USER }}@${{ vars.PROD_IP }}:/home/${{ vars.PROD_USER }}/${{ vars.NAME }}.env

      - name: Load and run Docker image on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ vars.PROD_IP }}
          username: ${{ vars.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            if [ $(sudo docker ps -q -f name=${{ vars.NAME }}) ]; then
              echo "Stopping old container..."
              sudo docker stop ${{ vars.NAME }}
            fi

            if [ $(sudo docker images -q ${{ vars.NAME }}:latest) ]; then
              echo "Removing old image..."
              sudo docker rmi ${{ vars.NAME }}:latest
            fi

            sudo docker load -i /home/${{ vars.PROD_USER }}/${{ vars.NAME }}.tar
            chmod 600 /home/${{ vars.PROD_USER }}/${{ vars.NAME }}.env

            sudo docker run -d --hostname ${{ vars.NAME }} --network node01 --name ${{ vars.NAME }} --rm \
              --env-file /home/${{ vars.PROD_USER }}/${{ vars.NAME }}.env \
              ${{ vars.NAME }}:latest

            # The boot line reports whether Mailgun came up. Without it a
            # misdelivered .env only shows up as a 503 on the first real lead.
            sleep 3
            sudo docker logs ${{ vars.NAME }} 2>&1 | tail -n 12
            sudo docker logs ${{ vars.NAME }} 2>&1 | grep -q "mail: mailgun" || {
              echo "::error::container booted without Mailgun — check the PROD_ENV variable"
              exit 1
            }
